services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inventory_saas
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory_saas"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      SECRET_KEY: local-compose-only-secret
      DATABASE_URL: postgresql://inventory:inventory@db:5432/inventory_saas
      RUN_MIGRATIONS: "true"
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  postgres_data:
