services:
  - type: web
    name: inventory-saas-api
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health/ready/
    autoDeployTrigger: checksPass
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-saas-db
          property: connectionString
      - key: APP_ENVIRONMENT
        value: production
      - key: SMS_BACKEND
        value: disabled
      - key: RUN_MIGRATIONS
        value: true
      - key: WEB_CONCURRENCY
        value: 2

databases:
  - name: inventory-saas-db
    databaseName: inventory_saas
    user: inventory
    region: frankfurt
    plan: free
    ipAllowList: []
