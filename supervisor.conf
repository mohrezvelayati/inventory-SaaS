[program:celery-worker]
process_name=%(program_name)s_%(process_num)02d
command=celery -A config worker --loglevel=INFO --concurrency=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
startsecs=10
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0